<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universities Finder</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f6f9;
      color: #222;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 24px;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 18px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #1971c2;
      color: #fff;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1864ab;
    }

    button:disabled {
      background: #adb5bd;
      cursor: not-allowed;
    }

    .status {
      margin-bottom: 14px;
      font-size: 14px;
      color: #555;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e9ecef;
      font-size: 14px;
    }

    th {
      background: #f1f3f5;
      font-weight: bold;
    }

    tr:hover {
      background: #f8f9fa;
    }

    a {
      color: #1971c2;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Search Universities by Country</h1>

    <div class="search-bar">
      <input
        type="text"
        id="countryInput"
        placeholder="Enter country name (e.g., India, United States, Canada)"
      />
      <button id="searchBtn">Search</button>
    </div>

    <div id="status" class="status">Enter a country name and click Search.</div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>University Name</th>
          <th>State / Province</th>
          <th>Website</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
