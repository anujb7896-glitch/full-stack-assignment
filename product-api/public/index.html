<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Catalog (CSR)</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f6f9;
      color: #222;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 820px;
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #1971c2;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #1864ab;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 16px;
      background: #fafafa;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .meta {
      font-size: 14px;
      color: #495057;
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Products (Client-Side Rendered)</h1>

    <form id="productForm">
      <input type="text" id="name" placeholder="Product Name" required />
      <input type="number" id="price" placeholder="Price (₹)" step="0.01" required />
      <input type="number" id="rating" placeholder="Rating (1-5)" min="1" max="5" step="0.1" required />
      <button type="submit">Add Product</button>
    </form>

    <div id="productList" class="grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
