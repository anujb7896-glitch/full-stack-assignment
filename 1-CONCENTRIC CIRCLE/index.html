
<!DOCTYPE html>
<html>
<head>
    <title>Concentric Circles</title>

    <style>
        .circle {
            border-radius: 50%;
            position: absolute;
        }

        .circle1 {
            width: 60px;
            height: 60px;
            background-color: red;
            top: 30px;
            left: 30px;
        }

        .circle2 {
            width: 40px;
            height: 40px;
            background-color: yellow;
            top: 40px;
            left: 40px;
        }

        .circle3 {
            width: 20px;
            height: 20px;
            background-color: blue;
            top: 50px;
            left: 50px;
        }
    </style>
</head>

<body>
    <h2>Three Concentric Circles</h2>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

</body>
</html>
